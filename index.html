<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/app-icon-96.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pro Tutors Hub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Pro Tutors Hub</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 16% 12%, rgba(255, 200, 61, 0.22), transparent 26%),
          radial-gradient(circle at 88% 18%, rgba(124, 35, 155, 0.12), transparent 30%),
          linear-gradient(135deg, #ffffff 0%, #fffaf0 55%, #fbf3ff 100%);
        color: #2b0644;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .boot-card {
        width: min(420px, 100%);
        border: 1px solid rgba(75, 11, 115, 0.14);
        border-radius: 18px;
        padding: 30px 28px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 80px rgba(75, 11, 115, 0.16);
      }

      .boot-card img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(75, 11, 115, 0.16);
      }

      .boot-card h1 {
        margin: 14px 0 8px;
        font-size: 28px;
        color: #4b0b73;
      }

      .boot-card p {
        margin: 0;
        color: #6a4b7a;
        font-weight: 700;
      }

      .boot-progress {
        position: relative;
        width: min(260px, 100%);
        height: 10px;
        margin: 22px auto 0;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(75, 11, 115, 0.12);
      }

      .boot-progress::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ffe07a, #ffc83d, #e49a16);
        animation: bootLoading 1.25s ease-in-out infinite;
      }

      .boot-spark {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        margin-top: 18px;
        border-radius: 50%;
        background: #ffc83d;
        color: #4b0b73;
        font-weight: 950;
        box-shadow: 0 10px 24px rgba(228, 154, 22, 0.24);
      }

      @keyframes bootLoading {
        0% {
          transform: translateX(-90%);
        }
        55% {
          transform: translateX(96%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen">
        <section class="boot-card">
          <img src="/app-icon-96.png" alt="Pro Tutors Hub" />
          <h1>Pro Tutors Hub</h1>
          <p>Loading Primary Mathematics...</p>
          <div class="boot-progress" aria-hidden="true"></div>
          <span class="boot-spark" aria-hidden="true">✦</span>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
